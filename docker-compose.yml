version: '3.8'
services:
  gdbgui:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - ./gdbgui/server/uploads:/app/gdbgui/server/uploads
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
